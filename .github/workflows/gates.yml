name: gates

# Fase 9 — CI sem segredos.
# Executa os gates de servidor e Android da Fase 8 em runners públicos e o
# bundle Windows no push para master. Nenhum secret, nenhum keystore:
# o APK release é gerado unsigned por design (printReleaseSigningStatus =
# RELEASE_SIGNING=unsigned) e a assinatura de distribuição permanece manual,
# fora do repositório.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server gates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Full test suite
        # Current local Windows suite: 388 tests; NTFS/ACL-specific cases may
        # be skipped on non-Windows runners.
        run: uv run --no-sync pytest -q
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Compile all Python
        run: uv run --no-sync python -m compileall -q app scripts
      - name: Bandit security scan (medium+)
        run: uv run --no-sync bandit -q -ll -r app scripts
      - name: pip-audit dependency vulnerabilities
        run: uv run --no-sync pip-audit
      - name: Gitleaks secret scan
        run: |
          set -euo pipefail
          version=8.30.1
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          report="$RUNNER_TEMP/gitleaks.sarif"
          set +e
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path "$report" \
            --exit-code 1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Gitleaks diagnostic: version=$version sha=$(git rev-parse HEAD)"
            if [ -s "$report" ]; then
              jq -r '.runs[].results[] | "::error file=" + (.locations[0].physicalLocation.artifactLocation.uri // "unknown") + ",line=" + ((.locations[0].physicalLocation.region.startLine // 0) | tostring) + ",title=Gitleaks " + (.ruleId // "unknown") + "::redacted finding"' "$report"
            else
              echo "Gitleaks did not produce a SARIF report"
            fi
          fi
          exit "$rc"
      - name: Lockfile healthy
        run: uv lock --check

  android:
    name: Android gates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK 35 (build-tools + platform)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;35.0.0" "platforms;android-35" >/dev/null
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain --no-daemon
      - name: Assemble debug, release and instrumentation APKs (release stays unsigned)
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease
          :app:assembleDebugAndroidTest :app:printReleaseSigningStatus
          --console=plain --no-daemon
      - name: Assert release is honestly unsigned (no-secrets gate)
        shell: bash
        run: |
          status=$(./gradlew :app:printReleaseSigningStatus --console=plain --no-daemon | grep -E "^RELEASE_SIGNING=" | tail -1)
          echo "status=$status"
          if [ "$status" != "RELEASE_SIGNING=unsigned" ]; then
            echo "::error::Release signing must be unsigned in CI (no secrets)."
            exit 1
          fi

  windows-bundle:
    name: Windows bundle + smoke
    # Runs on master and manual dispatch (not on every PR) to keep PRs cheap.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Build PyInstaller bundle
        run: uv run --no-sync python scripts/build_windows.py
      - name: Smoke the frozen bundle
        run: uv run --no-sync python scripts/smoke_windows_bundle.py